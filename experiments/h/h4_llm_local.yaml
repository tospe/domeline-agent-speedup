# H4, LLM methods on the local mini-coder-4b (Agent A), 1 seed: the small space, same settings as h4.yaml, budget 50.
# team = C's loop with the LLM role agents (readings + routing + verifier); single = one LLM, every
# knob, scalar history; single_readings = the same with Domeline readings; eat = Evolving-Agent-Teams
# style supervisor team, no readings, no routing. Pinned model IDs: claude-sonnet-5-5, claude-haiku-5-5.
experiment: h4_llm_local
space: small
evaluator: fast
sessions: search
budget: 50
seeds: [0]
verifier: on
sampling: host
exclude: {}
reference: {speedup: 9.4684}   # fastest legal design of the 14-knob sweep; the report also gives the gap to 9.4847
plugins: []
methods:
  - {name: "harness.llm_agents:h_team", backend: local, max_rounds: 8, label: team_local}
  - {name: "harness.llm_agents:h_single", backend: local, label: single_local}
  - {name: "harness.llm_agents:h_single", backend: local, with_readings: true, label: single_readings_local}
  - {name: "harness.llm_agents:h_eat", backend: local, label: eat_local}
