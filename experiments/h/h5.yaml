# H5: the large space (626 knobs). Deterministic team and scalar baselines, uncapped row;
# capped rows: --set caps.area_mm2=5000 --set experiment=h5_a5000 (and C's DP optimum as reference.dp_opt_s).
experiment: h5
space: large
evaluator: fast
sessions: search
budget: 3000
seeds: [0, 1, 2]
caps: {}
verifier: on
sampling: host
exclude: {}
reference: {speedup: 9.4684, dp_opt_s: null}
methods:
  - {name: team, coordinate: first}
  - random
  - {name: tpe, budget: 1000}   # TPE over 626 categoricals: ~60 ms/trial at 150 trials, growing with history
  - sa
  - hill
