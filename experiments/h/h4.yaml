# H4: the small space (17 knobs, the walk's space). Walk, deterministic team, scalar baselines;
# LLM methods join by name once Agent A registers them (add the module to plugins:).
experiment: h4
space: small
evaluator: fast            # FastEvaluator: identical walk (31 evals, 9.4163x) in 0.35 s instead of 21 s
sessions: search
budget: 100
seeds: [0, 1, 2]
verifier: on               # illegal proposals cost no evaluation (as in the team)
sampling: host             # rule (a), pending the user's call
exclude: {}
reference: {speedup: 9.4684}   # fastest legal design of the 14-knob sweep (REPORT-M2)
plugins: []
methods:
  - walk
  - team
  - random
  - tpe
  - sa
  - hill
