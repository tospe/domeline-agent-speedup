# Host profile: the cost of every op left on the host CPU, as one input.
# Generated by experiments/export_inputs.py from results/cpu/cpu_ops.tsv (rows for
# 8 threads, measured by profile/cpu_ops.c) and the `cpu` entry of
# lib/tech/host.yaml (roofline fallback). Loaded by harness.inputs.HostProfile.from_file.
#
# Cost of an op of kind k on the host at context L, for a step of n tokens:
#   measured kind:  n * interp(L; measured[k])   (linear extrapolation past the last point)
#   other kinds:    max(flops / ops_per_s, bytes / mem_bw_Bps) + op_overhead_s
# Per op class, at the workload's sizes (mini-coder-4b):
#   gather       measured: -; roofline: embed
#   kv_append    measured: kv_append; roofline: -
#   mvm_dynamic  measured: attn_score, attn_value; roofline: -
#   mvm_static   measured: q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, lm_head; roofline: -
#   vector       measured: rmsnorm, qk_norm, rope, softmax, residual, act; roofline: sample
# Tool times tau are not here: they are measured on this same host and stored per turn in
# the workload trace (lib/workload/mini_coder_4b_trace.tsv, column t_tool_s); tool_scale
# rescales them for a different host (1.0 = the traced host).

name: cpu
host: "Intel i9-12900K, 8 threads"
source: "Measured on this host (i9-12900K, 8 threads) by profile/cpu_ops.c (H3)"
maturity: published-silicon
supports: [vector, gather, mvm_static, mvm_dynamic, kv_append]
threads: 8
tool_scale: 1.0
roofline:
  ops_per_s: 200000000000.0
  mem_bw_Bps: 60000000000.0
  op_overhead_s: 1e-06
sources:
  write_mechanism: "host memory"
  area_mm2_per_unit: "convention: the host is not coprocessor area"
  effort_months: "convention: the host, effort 0"
  threads: "measurement configuration of results/cpu/cpu_ops.tsv"
  ops_per_s: "VERIFY: i9-12900K datasheet-level estimate; used only for ops the profile lacks (embed, sample)"
  mem_bw_Bps: "VERIFY: i9-12900K datasheet-level estimate; used only for ops the profile lacks (embed, sample)"
  op_overhead_s: "VERIFY: assumed 1 us per unprofiled op"
  measured: "profile/cpu_ops.c on this host (results/cpu/cpu_ops.tsv, H3)"
