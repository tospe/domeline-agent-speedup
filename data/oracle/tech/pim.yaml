# Coprocessor technologies. One entry per technology; `units` in a Design
# sets how many arrays / lanes a design instantiates.
#
# maturity: published-silicon (measured chip) | simulated (published, modeled)
#           | projected (our assumption; must be checked before the paper)
# Entries whose notes say VERIFY have numbers recalled from the cited paper
# that still need checking against the PDF.

- name: xbar_isaac
  kind: crossbar
  supports: [mvm_static, mvm_dynamic, kv_append]
  source: "Shafiee et al., ISAAC, ISCA 2016, Table I (checked): 128x128 xbars, 2 b/cell, 1-b DAC, 8-b ADC at 1.2 GSps, 8 xbars and 8 ADCs per IMA, 12 IMAs per tile, tile 0.372 mm2 at 32 nm; 'one cycle, which is the read latency' = 100 ns"
  maturity: simulated
  effort_months: 0
  # Tile 0.372 mm^2 (32 nm) holds 12 IMAs x 8 xbars = 96 xbars, so 0.00388 mm^2 per
  # xbar with its ADCs, eDRAM and routing amortized in. At chip level (85.4 mm^2 for
  # 168 tiles, I/O included) it is 0.0053 mm^2.
  area_mm2_per_unit: 0.00388
  precisions: [8, 16]
  sources:
    precisions: "ISAAC slices wide weights over 2-b cells (16-b weights in the paper); 8 = the int8 (Q8_0) weights of the workload"
    write_mechanism: "PipeLayer (HPCA 2017) ReRAM row write; ISAAC itself never writes at run time"
    area_mm2_per_unit: "ISAAC Table I: tile 0.372 mm2 / (12 IMAs x 8 xbars) (checked)"
    effort_months: "convention: reference technology, effort 0"
    rows: "ISAAC Table I (checked)"
    cols: "ISAAC Table I (checked)"
    bits_per_cell: "ISAAC Table I (checked)"
    input_bits: "workload: int8 activations (ISAAC uses 16-b inputs); design choice"
    dac_bits: "ISAAC Table I: 1-b DAC (checked)"
    t_read_s: "ISAAC: one 100 ns cycle is the read latency (checked)"
    t_add_s: "VERIFY: assumed 1 ns per adder-tree level"
    t_write_row_s: "VERIFY: PipeLayer HPCA 2017 single-pulse ReRAM write, 50.88 ns (moves the headline <1%)"
    write_parallel_arrays: "VERIFY: assumed 1024 arrays written in parallel"
  params:
    write_mechanism: true
    rows: 128
    cols: 128
    bits_per_cell: 2
    input_bits: 8          # int8 activations
    dac_bits: 1            # bit-serial inputs: 8 read cycles per MVM
    t_read_s: 100e-9       # one read cycle: 128 columns through one 1.2 GSps ADC (ISAAC: 100 ns)
    t_add_s: 1e-9          # one level of the partial-sum adder tree
    t_write_row_s: 50.88e-9   # PipeLayer (HPCA 2017) ReRAM write latency, single pulse
    write_parallel_arrays: 1024
    transpose_write: false
    layer_pipelined: true     # ISAAC pipelines across layers
  notes: "Read cycle and area checked against ISAAC Table I. ISAAC does not write at run time; write latency from PipeLayer, VERIFY (moves the headline <1%, see sensitivity)."

