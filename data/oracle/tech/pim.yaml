- name: xbar_transpose
  kind: crossbar
  supports: [mvm_static, mvm_dynamic, kv_append]
  source: "ISAAC geometry with a transposable write path (K append becomes one row write)"
  maturity: projected
  effort_months: 3
  area_mm2_per_unit: 0.0045
  precisions: [8, 16]
  sources:
    precisions: "as xbar_isaac"
    write_mechanism: "transposable write path (assumed), PipeLayer write latency"
    area_mm2_per_unit: "VERIFY: ISAAC xbar area +15% for a second write driver set (assumption)"
    effort_months: "VERIFY: assumed 3 months for the transposable write path"
    rows: "ISAAC Table I (checked)"
    cols: "ISAAC Table I (checked)"
    bits_per_cell: "ISAAC Table I (checked)"
    input_bits: "workload: int8 activations; design choice"
    dac_bits: "ISAAC Table I (checked)"
    t_read_s: "ISAAC (checked)"
    t_add_s: "VERIFY: assumed 1 ns per adder-tree level"
    t_write_row_s: "VERIFY: PipeLayer HPCA 2017 single-pulse ReRAM write, 50.88 ns"
    write_parallel_arrays: "VERIFY: assumed 1024 arrays written in parallel"
  params:
    write_mechanism: true
    rows: 128
    cols: 128
    bits_per_cell: 2
    input_bits: 8
    dac_bits: 1
    t_read_s: 100e-9
    t_add_s: 1e-9
    t_write_row_s: 50.88e-9
    write_parallel_arrays: 1024
    transpose_write: true
    layer_pipelined: true
  notes: "Area +15% for the second write driver set is an assumption. VERIFY against a published transposable ReRAM/SRAM array."

- name: vfu_puma
  kind: digital
  supports: [vector, kv_append, mvm_dynamic, gather]
  source: "Ankit et al., PUMA, ASPLOS 2019 (vector functional unit next to the MVM units)"
  maturity: simulated
  effort_months: 1
  area_mm2_per_unit: 0.004
  precisions: [8, 16]
  sources:
    precisions: "PUMA VFU is 16-b fixed point; int8 KV assumed to run on it at the same rate"
    write_mechanism: "KV appends go to its local memory"
    area_mm2_per_unit: "VERIFY: assumed, PUMA VFU area not checked"
    effort_months: "VERIFY: assumed 1 month"
    ops_per_s: "VERIFY: 4 lanes at 1 GHz, PUMA Table 3 width/clock not checked"
    mem_bw_Bps: "design knob (space.KNOBS vfu_bw overrides it when attention runs here); not from PUMA"
    local_mem_bytes: "design knob (space.KNOBS vfu_mem overrides it when attention runs here); not from PUMA"
    op_overhead_s: "VERIFY: assumed 5 ns per op"
  params:
    write_mechanism: true
    ops_per_s: 4.0e9            # per unit: 4 lanes at 1 GHz
    mem_bw_Bps: 64.0e9          # local SRAM/eDRAM read bandwidth for KV, total
    bw_scales_with_units: false
    local_mem_bytes: 8.0e9      # KV store next to the unit (stacked DRAM), total
    mem_scales_with_units: false
    op_overhead_s: 5.0e-9
  notes: "One unit = one PUMA-style VFU. VERIFY VFU width and clock in PUMA Table 3. KV memory size/bandwidth are design knobs, not from PUMA."

- name: softmax_star
  kind: digital
  supports: [vector]
  source: "Zhai et al., STAR softmax engine, arXiv 2401.17582 (concept); throughput is a sizing knob"
  maturity: projected
  effort_months: 4
  area_mm2_per_unit: 0.02
  precisions: [16]
  sources:
    precisions: "fp16 activations (workload); VERIFY against STAR's datapath width"
    write_mechanism: "fixed-function nonlinear unit, no stored matrix"
    area_mm2_per_unit: "VERIFY: placeholder to size, STAR's area not checked"
    effort_months: "VERIFY: assumed 4 months"
    ops_per_s: "VERIFY: placeholder to size, STAR's throughput not checked"
    mem_bw_Bps: "VERIFY: placeholder (own score buffer per instance)"
    op_overhead_s: "VERIFY: assumed 2 ns per op"
  params:
    write_mechanism: false
    ops_per_s: 64.0e9           # per instance
    mem_bw_Bps: 64.0e9          # per instance: each has its own score buffer
    bw_scales_with_units: true
    op_overhead_s: 2.0e-9
  notes: "Fixed-function nonlinear unit (softmax, norms, SiLU). Numbers are placeholders to size; VERIFY against STAR's reported throughput/area."

- name: upmem_dpu
  kind: dram_pim
  supports: [mvm_static, mvm_dynamic, vector, kv_append]
  source: "UPMEM measured on a 2,560-DPU server (VIPER case study): 48 MOPS int8 MAC/DPU, T_transfer = 1.82 ms + 1.68 us x N"
  maturity: published-silicon
  effort_months: 0
  area_mm2_per_unit: 0.0
  precisions: [8, 16]
  sources:
    precisions: "int8 MAC measured (VIPER); DPUs run 16/32-b integer arithmetic natively"
    write_mechanism: "MRAM written by host transfers"
    area_mm2_per_unit: "convention: DRAM-PIM dies are memory, not coprocessor logic area"
    effort_months: "convention: commercial part, effort 0"
    ops_per_s: "measured: 48 M int8 MAC/s per DPU on the 2,560-DPU server (VIPER case study)"
    bank_bw_Bps: "VERIFY: MRAM->WRAM per DPU, Gomez-Luna et al., IEEE Access 2022"
    local_mem_bytes: "UPMEM: 64 MB MRAM per DPU (Gomez-Luna et al., IEEE Access 2022)"
    op_overhead_s: "model convention: per-call cost is in the measured transfer law"
    xfer_t0_s: "measured: T_transfer = 1.82 ms + 1.68 us x N (VIPER case study)"
    xfer_s_per_unit: "measured: T_transfer = 1.82 ms + 1.68 us x N (VIPER case study)"
    units_ref: "experiment convention (experiments/generality.py): xbar_scale 1.25 -> 2,560 DPUs, the measured server"
  params:
    write_mechanism: true
    ops_per_s: 96.0e6          # 48 M MAC/s = 96 M op/s per DPU
    bank_bw_Bps: 0.63e9        # MRAM->WRAM per DPU (Gomez-Luna et al., IEEE Access 2022). VERIFY
    local_mem_bytes: 64.0e6    # MRAM per DPU
    mem_scales_with_units: true
    host_scatter: true
    op_overhead_s: 0.0
    xfer_t0_s: 1.82e-3         # measured transfer law (VIPER case study): T = 1.82 ms + 1.68 us x N DPUs
    xfer_s_per_unit: 1.68e-6
    units_ref: 2048            # sizing reference for experiments/generality.py: xbar_scale 1.25 -> 2,560 DPUs, the measured server
  notes: "Not a contender; included so the harness can reject it. Link for UPMEM designs: t0_s=1.82e-3, alpha_s_per_unit=1.68e-6."
