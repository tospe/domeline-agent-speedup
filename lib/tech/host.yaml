# Host CPUs. The coprocessor attaches to this CPU; tools always run here.

- name: cpu
  kind: cpu
  supports: [vector, gather, mvm_static, mvm_dynamic, kv_append]
  source: "Measured on this host (i9-12900K, 8 threads) by profile/cpu_ops.c (H3)"
  maturity: published-silicon
  params:
    profile_tsv: results/cpu/cpu_ops.tsv
    threads: 8
    ops_per_s: 200.0e9        # fallback for ops the profile does not cover
    mem_bw_Bps: 60.0e9
    op_overhead_s: 1.0e-6

- name: cpu_roofline
  kind: cpu
  supports: [vector, gather, mvm_static, mvm_dynamic, kv_append]
  source: "i9-12900K datasheet-level roofline (no measurement); used until the H3 profile exists"
  maturity: projected
  params:
    ops_per_s: 200.0e9
    mem_bw_Bps: 60.0e9
    op_overhead_s: 1.0e-6
