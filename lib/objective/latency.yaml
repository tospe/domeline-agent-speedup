# Objective and caps (harness.inputs.Objective.from_file).
# metric: latency only (workload time = LLM + tools over the sessions; inf if infeasible).
# Energy and throughput are out of scope for now.
metric: latency
caps:                       # null = no cap (the paper's main result is uncapped)
  area_mm2: null
  effort_months: null
tol: 0.01                   # report the smallest design within 1% of the fastest
baseline:                   # speedups are over this GPU (llama-bench G1 decode curve + per-turn
  g1: results/gpu/g1.jsonl  # measured GPU times in the trace)
  weights: Q8_0
  kv: f16
