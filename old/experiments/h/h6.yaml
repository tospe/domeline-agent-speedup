# H6: verifier off. Every proposal is evaluated; each evaluated design is verified on the side
# (shadow) to count illegal proposals, the rules they hit and which accepted moves were illegal.
experiment: h6
space: large
evaluator: fast
sessions: search
budget: 3000
seeds: [0]                 # the deterministic team does not depend on the seed
verifier: shadow
sampling: host
exclude: {}
reference: {speedup: 9.4684}
methods:
  - {name: team, coordinate: first, label: team_first}
  - {name: team, coordinate: stall, stall_k: 20, label: team_stall20}
