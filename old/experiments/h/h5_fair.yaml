# H5 fairness rows (lead, after M6): same space, sessions, budgets and verifier as h5.yaml.
#  (a) SA / hill started from the walk's design, tied on the large space
#  (b) SA / hill / TPE over the tied subspace plus per-slot moves (tied moves = small-space moves lifted)
#  (c) hill climb with tol 0 (any strict improvement), from START
experiment: h5_fair
space: large
evaluator: fast
sessions: search
budget: 3000
seeds: [0, 1, 2]
caps: {}
verifier: on
prefilter: true
sampling: host
exclude: {}
reference: {speedup: 9.4684, dp_opt_s: null}
methods:
  - {name: sa, start: walk, label: a_sa_walk}
  - {name: hill, start: walk, label: a_hill_walk}
  - {name: sa, tied: true, label: b_sa_tied}
  - {name: hill, tied: true, label: b_hill_tied}
  - {name: tied_tpe, budget: 1000, label: b_tpe_tied}   # TPE's budget in h5.yaml
  - {name: hill, tol: 0.0, label: c_hill_tol0}
