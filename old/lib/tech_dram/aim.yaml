# Second technology library for the generality experiment (E8,
# experiments/generality.py). Loaded on top of lib/tech with every crossbar
# entry removed, so the MVM role is filled by DRAM-PIM: UPMEM (lib/tech/pim.yaml,
# measured) and this GDDR6 accelerator-in-memory entry.
#
# Every number below is recalled from the cited paper and is marked VERIFY until
# checked against the PDF. Not part of the main library (experiments/common.py
# loads lib/tech only).

- name: aim_gddr6
  kind: dram_pim
  supports: [mvm_static, mvm_dynamic, vector, kv_append]
  source: "Kwon et al., 'A 1ynm 1.25V 8Gb 16Gb/s/pin GDDR6-based Accelerator-in-Memory supporting 1TFLOPS MAC operation', ISSCC 2022 (SK hynix AiM): 8 Gb per chip, 2 channels x 16 banks, one 16-lane BF16 MAC unit per bank at 1 GHz"
  maturity: published-silicon
  effort_months: 0
  area_mm2_per_unit: 0.0           # memory dies, not coprocessor logic area (same convention as UPMEM)
  precisions: [16]
  sources:
    precisions: "AiM computes in BF16 (Kwon et al., ISSCC 2022); the harness charges int8/int16 bytes, see notes"
    write_mechanism: "DRAM banks written over the GDDR6 channel"
    area_mm2_per_unit: "convention: DRAM-PIM dies are memory, not coprocessor logic area (as UPMEM)"
    effort_months: "convention: commercial-class part, effort 0"
    ops_per_s: "VERIFY: 32 banks x 16 MAC x 2 op x 1 GHz = 1 TFLOPS (paper title), clock not checked"
    bank_bw_Bps: "VERIFY: 32 banks x 32 B/cycle x 1 GHz, not checked"
    local_mem_bytes: "Kwon et al., ISSCC 2022 title: 8 Gb per chip"
    op_overhead_s: "VERIFY: assumed 100 ns per op (command issue + global-buffer load)"
    units_ref: "experiment convention (experiments/generality.py): xbar_scale 1.25 -> 10 chips"
  params:
    write_mechanism: true
    ops_per_s: 1.0e12              # per chip: 32 banks x 16 MAC x 2 op x 1 GHz = 1 TFLOPS (paper title). VERIFY clock
    bank_bw_Bps: 1.0e12            # per chip, all banks: 32 banks x 32 B/cycle x 1 GHz. VERIFY
    local_mem_bytes: 1.0e9         # 8 Gb per chip
    mem_scales_with_units: true
    host_scatter: false            # GDDR6 channel commands, no per-unit host scatter
    op_overhead_s: 1.0e-7          # per op: command issue + global-buffer load. Assumption, VERIFY
    units_ref: 8                   # sizing reference: xbar_scale 1.25 -> 10 chips (a card-class part)
  notes: "AiM computes in BF16; the harness charges weights and KV at the design's int8/int16 precision, which flatters AiM's byte traffic by up to 2x. All numbers VERIFY."
